services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3060:3060'
    environment:
      PORT: 3060
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: giftlink
      JWT_SECRET: docker-dev-secret-change-me
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ''
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  mongo_data:
